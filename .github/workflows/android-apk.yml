name: Android APK

on:
  push:
    branches: ['**']
    paths-ignore:
      - '*.html'
      - 'CNAME'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: ver
        run: |
          # versionCode는 실행 번호 기반이라 빌드마다 증가한다.
          echo "code=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          echo "name=2.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease \
            -PversionCode=${{ steps.ver.outputs.code }} \
            -PversionName=${{ steps.ver.outputs.name }}
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/MemoAutoRecorder-${{ steps.ver.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MemoAutoRecorder-${{ steps.ver.outputs.name }}
          path: out/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ steps.ver.outputs.name }}
          name: MemoAutoRecorder ${{ steps.ver.outputs.name }} (${{ github.ref_name }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/*.apk
          body: |
            브랜치: `${{ github.ref_name }}`
            커밋: ${{ github.sha }}
            versionCode: ${{ steps.ver.outputs.code }}

            폰 브라우저에서 아래 Assets의 `.apk`를 눌러 받은 뒤 설치하세요.
